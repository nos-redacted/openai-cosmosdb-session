title = "openai-cosmosdb-session secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Generated environments, caches, and build outputs"
paths = [
    '''(^|/)\.venv(-live)?/''',
    '''(^|/)(build|dist|artifacts)/''',
    '''(^|/)(\.mypy_cache|\.pytest_cache|\.ruff_cache|__pycache__)/''',
]