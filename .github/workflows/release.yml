name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string
      live_run_id:
        description: Successful Live Cosmos OIDC workflow run ID
        required: true
        type: string
      load_run_id:
        description: Successful five-minute mixed load workflow run ID
        required: true
        type: string
      managed_identity_run_id:
        description: Successful Azure-hosted Managed Identity Cosmos workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.1"
  RELEASE_TAG: ${{ inputs.tag }}
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify cloud evidence provenance
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_RUN_ID: ${{ inputs.live_run_id }}
          LOAD_RUN_ID: ${{ inputs.load_run_id }}
          MANAGED_IDENTITY_RUN_ID: ${{ inputs.managed_identity_run_id }}
        run: |
          [[ "$LIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$LOAD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$MANAGED_IDENTITY_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p cloud/run-metadata
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$LIVE_RUN_ID" > cloud/run-metadata/live.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$LOAD_RUN_ID" > cloud/run-metadata/load.json
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$MANAGED_IDENTITY_RUN_ID" > cloud/run-metadata/managed-identity.json
          release_sha="$(git rev-parse HEAD)"
          python scripts/verify_workflow_run.py \
            --metadata cloud/run-metadata/live.json \
            --run-id "$LIVE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$release_sha" \
            --workflow-path .github/workflows/live.yml
          python scripts/verify_workflow_run.py \
            --metadata cloud/run-metadata/managed-identity.json \
            --run-id "$MANAGED_IDENTITY_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$release_sha" \
            --workflow-path .github/workflows/managed-identity.yml
          python scripts/verify_workflow_run.py \
            --metadata cloud/run-metadata/load.json \
            --run-id "$LOAD_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$release_sha" \
            --workflow-path .github/workflows/live.yml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: live-test-results-oidc
          path: cloud/live
          run-id: ${{ inputs.live_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cosmos-load-results
          path: cloud/load
          run-id: ${{ inputs.load_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-identity-test-results
          path: cloud/managed-identity
          run-id: ${{ inputs.managed_identity_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv lock --check
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - name: Audit locked runtime dependencies
        run: |
          mkdir -p release
          uv export --locked --no-dev --all-extras --no-emit-project \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/runtime-requirements.txt" \
            --quiet
          uv run pip-audit \
            --requirement "$RUNNER_TEMP/runtime-requirements.txt" \
            --disable-pip --strict --progress-spinner off \
            --format json --output release/dependency-audit.json
      - name: Scan tagged Git history for secrets
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact \
            --report-format json --report-path release/secret-scan.json .
      - run: uv run ruff check .
      - run: >-
          uv run mypy src benchmarks/load_cosmos.py
          scripts/managed_identity_evidence.py scripts/run_managed_identity_tests.py
          scripts/verify_release.py scripts/verify_workflow_run.py
      - run: >-
          uv run pytest -m "not live_cosmos" -q
          --junit-xml=source-test-results.xml
      - run: uv run python -m build
      - run: uv venv --python 3.13 "$RUNNER_TEMP/release-wheel-venv"
      - run: >-
          uv pip install --python "$RUNNER_TEMP/release-wheel-venv/bin/python"
          dist/*.whl pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Test the exact release wheel outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          "$RUNNER_TEMP/release-wheel-venv/bin/python" -m pytest
          "${{ github.workspace }}/tests" -m "not live_cosmos" -q
          --junit-xml="$RUNNER_TEMP/wheel-test-results.xml"
      - name: Verify archives, cloud provenance, load baseline, and release notes
        run: |
          managed_identity_run_attempt="$(python -c \
            'import json; print(json.load(open("cloud/run-metadata/managed-identity.json"))["run_attempt"])')"
          release_sha="$(git rev-parse HEAD)"
          uv run python -m scripts.verify_release \
            --tag "$RELEASE_TAG" \
            --live-junit cloud/live/live-test-results.xml \
            --managed-identity-junit cloud/managed-identity/managed-identity-test-results.xml \
            --managed-identity-repository "$GITHUB_REPOSITORY" \
            --managed-identity-commit "$release_sha" \
            --managed-identity-run-id "${{ inputs.managed_identity_run_id }}" \
            --managed-identity-run-attempt "$managed_identity_run_attempt" \
            --managed-identity-image-digest-file cloud/managed-identity/image-digest.txt \
            --load-report cloud/load/load-results.json \
            --dependency-audit release/dependency-audit.json \
            --secret-scan release/secret-scan.json \
            --notes-output release/notes.md
      - run: sha256sum dist/* > release/SHA256SUMS
      - uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          path: dist/
          format: cyclonedx-json
          output-file: release/openai-cosmosdb-session.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Collect immutable release evidence
        run: |
          cp source-test-results.xml release/source-test-results.xml
          cp "$RUNNER_TEMP/wheel-test-results.xml" release/wheel-test-results.xml
          cp cloud/live/live-test-results.xml release/live-test-results.xml
          cp cloud/managed-identity/managed-identity-test-results.xml release/managed-identity-test-results.xml
          cp cloud/load/load-results.json release/load-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ inputs.tag }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openai-cosmosdb-session
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Require completed Azure-host managed-identity proof
        env:
          MANAGED_IDENTITY_RELEASE_ENABLED: ${{ vars.MANAGED_IDENTITY_RELEASE_ENABLED }}
        run: |
          test "$MANAGED_IDENTITY_RELEASE_ENABLED" = "true" || {
            echo "::error::Managed-identity release proof is not enabled"
            exit 1
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.tag }}
          path: candidate
      - name: Verify candidate checksums
        working-directory: candidate
        run: sha256sum --check release/SHA256SUMS
      - name: Publish the verified distributions with provenance
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: candidate/dist/
          print-hash: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ inputs.tag }}
          path: candidate
      - name: Create the GitHub release from verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          candidate/dist/*
          candidate/release/SHA256SUMS
          candidate/release/openai-cosmosdb-session.cdx.json
          candidate/release/source-test-results.xml
          candidate/release/wheel-test-results.xml
          candidate/release/live-test-results.xml
          candidate/release/managed-identity-test-results.xml
          candidate/release/load-results.json
          candidate/release/dependency-audit.json
          candidate/release/secret-scan.json
          --verify-tag
          --title "$RELEASE_TAG"
          --notes-file candidate/release/notes.md
