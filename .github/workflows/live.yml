name: Live Cosmos OIDC

on:
  workflow_dispatch:
    inputs:
      run_load:
        description: Run the protected Cosmos load baseline after live tests
        required: false
        default: false
        type: boolean
      load_scenario:
        description: Load scenario
        required: false
        default: mixed
        type: choice
        options:
          - mixed
          - spread-append
          - hot-append
          - multi-item-append
          - latest-n-read
          - clear-pop-overlap
          - deduplicated-retry
          - all
      load_concurrency:
        description: Load worker count
        required: false
        default: 32
        type: number
      load_rate:
        description: Offered operations per second
        required: false
        default: 100
        type: number
      load_duration:
        description: Measured load duration in seconds
        required: false
        default: 300
        type: number
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: live-cosmos-oidc
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.1"

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.COSMOS_OIDC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cosmos-integration
    permissions:
      contents: read
      id-token: write
    env:
      COSMOS_LIVE_TESTS: "1"
      COSMOS_AUTH_MODE: azure-cli
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      COSMOS_DATABASE: ${{ vars.COSMOS_DATABASE }}
      COSMOS_CONTAINER: ${{ vars.COSMOS_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Require protected OIDC and Cosmos configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID COSMOS_ENDPOINT COSMOS_DATABASE COSMOS_CONTAINER; do
            test -n "${!name}" || {
              echo "::error::$name is not configured"
              exit 1
            }
          done
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: >-
          uv run pytest -m live_cosmos tests/integration -v
          --junit-xml=live-test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: live-test-results-oidc
          path: live-test-results.xml
          if-no-files-found: warn

  load:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_load }}
    needs: live
    runs-on: ubuntu-latest
    environment: cosmos-load
    permissions:
      contents: read
      id-token: write
    env:
      COSMOS_AUTH_MODE: azure-cli
      COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
      COSMOS_DATABASE: ${{ vars.COSMOS_DATABASE }}
      COSMOS_CONTAINER: ${{ vars.COSMOS_LOAD_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Require protected OIDC and load configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID COSMOS_ENDPOINT COSMOS_DATABASE COSMOS_CONTAINER; do
            test -n "${!name}" || {
              echo "::error::$name is not configured"
              exit 1
            }
          done
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: mkdir -p artifacts
      - run: >-
          uv run python benchmarks/load_cosmos.py
          --scenario "${{ inputs.load_scenario }}"
          --concurrency "${{ inputs.load_concurrency }}"
          --rate "${{ inputs.load_rate }}"
          --duration "${{ inputs.load_duration }}"
          --warmup 30
          --output artifacts/load-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: cosmos-load-results
          path: artifacts/load-results.json
          if-no-files-found: warn
