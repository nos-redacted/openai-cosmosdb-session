name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_cosmos:
        description: Run tests against the protected Cosmos DB test account
        required: false
        default: false
        type: boolean

permissions: {}

env:
  UV_VERSION: "0.12.1"
  BICEP_VERSION: "0.46.1"
  BICEP_LINUX_X64_SHA256: "3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lock:
    name: Lock file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv lock --check

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python "${{ matrix.python-version }}"
      - if: ${{ matrix.python-version != '3.13' }}
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest
          -m "not live_cosmos" -q
          --junit-xml="test-results-${{ matrix.python-version }}.xml"
      - name: Test with branch coverage
        if: ${{ matrix.python-version == '3.13' }}
        run: >-
          uv run --python "${{ matrix.python-version }}" pytest
          -m "not live_cosmos" -q
          --junit-xml="test-results-${{ matrix.python-version }}.xml"
          --cov=openai_cosmosdb_session --cov-branch
          --cov-report=term --cov-report=xml:coverage.xml
          --cov-fail-under=84
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && matrix.python-version == '3.13' }}
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error

  minimums:
    name: Minimum direct dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv venv --python 3.10 .venv-minimums
      - run: >-
          uv pip install --python .venv-minimums/bin/python
          "azure-cosmos[aio]==4.16.3"
          "openai-agents==0.19.1"
          "pytest==9.1.1"
          "pytest-asyncio==1.4.0"
      - run: uv pip install --python .venv-minimums/bin/python --no-deps -e .
      - run: >-
          .venv-minimums/bin/python -m pytest -m "not live_cosmos" -q
          --junit-xml=test-results-minimums.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: test-results-minimums
          path: test-results-minimums.xml
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: uv run ruff check .
      - run: >-
          uv run mypy src benchmarks/load_cosmos.py
          scripts/managed_identity_evidence.py scripts/run_managed_identity_tests.py
          scripts/verify_release.py scripts/verify_workflow_run.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: >-
          uv export --locked --no-dev --all-extras --no-emit-project
          --format requirements-txt
          --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - run: >-
          uv run pip-audit
          --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          --disable-pip

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_LINUX_X64_SHA256}  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Scan full Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --no-banner --redact --verbose .

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install checksum-verified Bicep CLI
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64" \
            --output "$RUNNER_TEMP/bicep"
          echo "${BICEP_LINUX_X64_SHA256}  $RUNNER_TEMP/bicep" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bicep"
      - name: Compile infrastructure without diagnostics
        run: |
          diagnostics="$($RUNNER_TEMP/bicep build infra/live-test/main.bicep \
            --outfile "$RUNNER_TEMP/live-test.json" 2>&1)" || {
              printf '%s\n' "$diagnostics"
              exit 1
            }
          if grep --ignore-case --extended-regexp '(warning|error) BCP[0-9]+' <<<"$diagnostics"; then
            echo "::error::Bicep emitted compiler diagnostics"
            exit 1
          fi

  wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: uv run python -m build
      - run: mkdir artifacts
      - run: sha256sum dist/* > artifacts/SHA256SUMS
      - uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          path: dist/
          format: cyclonedx-json
          output-file: artifacts/openai-cosmosdb-session.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - run: uv venv --python 3.13 "$RUNNER_TEMP/wheel-venv"
      - run: >-
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python"
          dist/*.whl pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Import installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          from types import SimpleNamespace

          from agents.memory.session import Session
          from openai_cosmosdb_session import CosmosDBSession

          database = SimpleNamespace(get_container_client=lambda _: object())
          client = SimpleNamespace(get_database_client=lambda _: database)
          session = CosmosDBSession("wheel-check", client=client)

          assert CosmosDBSession.__module__ == "openai_cosmosdb_session.session"
          assert isinstance(session, Session)
          PY
      - name: Test installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest
          "${{ github.workspace }}/tests" -m "not live_cosmos" -q
          --junit-xml="$RUNNER_TEMP/wheel-test-results.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: package-evidence
          path: |
            artifacts/
            ${{ runner.temp }}/wheel-test-results.xml
          if-no-files-found: error

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4.8.2
        with:
          fail-on-severity: high

  live-cosmos:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_cosmos }}
    runs-on: ubuntu-latest
    environment: cosmos-integration
    permissions:
      contents: read
    env:
      COSMOS_LIVE_TESTS: "1"
      COSMOS_AUTH_MODE: connection-string
      COSMOS_CONNECTION_STRING: ${{ secrets.COSMOS_CONNECTION_STRING }}
      COSMOS_DATABASE: ${{ vars.COSMOS_DATABASE }}
      COSMOS_CONTAINER: ${{ vars.COSMOS_CONTAINER }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Require protected Cosmos configuration
        run: |
          test -n "$COSMOS_CONNECTION_STRING" || {
            echo "::error::COSMOS_CONNECTION_STRING is not configured"
            exit 1
          }
      - run: python -m pip install "uv==$UV_VERSION"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: >-
          uv run pytest -m live_cosmos tests/integration -v
          --junit-xml=live-test-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: live-test-results-connection-string
          path: live-test-results.xml
          if-no-files-found: error
